# What `metaobjects gen` and `metaobjects verify --codegen` run at the repository root,
# with no flags: the Home Assistant service model under models/, generated by this
# package's own generators.
#
#   PYTHONPATH=src uvx --python 3.12 --from "$METAOBJECTS" metaobjects gen   # then commit
#
# METAOBJECTS is the toolchain pin scripts/ci-local.sh carries; tests/metagen proves the
# committed files are what a regeneration writes. The generated files are committed with
# .metaobjects/.gen-state/.hashes.json, which is how a hand edit is told from output.
#
# This is not the requirements ledger. That is metaobjects/, read by scripts/reqgen.py
# and found by the `meta` CLI through .metaobjects/config.json; this file names a
# directory of its own so that neither model is ever loaded as part of the other. The
# header of each generated file still says "the model in metaobjects/": a generator is
# not told where the model it reads came from, so it cannot say, and the model those
# files come from is the one named below.
metadata: models
targets:
  # Ships in the wheel: the readers axi_toolkit.ha.services reads the model through.
  package:
    outDir: src/axi_toolkit/ha/model
    generators: ["axi_toolkit.metagen:readers"]
  # The check that every declared name is one the captured server sent.
  tests:
    outDir: tests/hamodel
    generators: ["axi_toolkit.metagen:capture_contract"]
