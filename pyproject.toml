[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "axi-toolkit"
version = "1.0.1"
description = "Python library for building AXI (Agent eXperience Interface) CLIs: a strict TOON encoder, errors that carry recovery as data, secret redaction, and environment-only credentials"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["axi", "agent", "agent-experience-interface", "cli", "library", "llm", "toon", "toon-encoder", "token-oriented-object-notation", "redaction", "requirements", "metaobjects"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
# Deliberately empty, and asserted by tests/test_purity.py. `hass-axi` installs with
# exactly one runtime dependency and must keep doing so after it takes this package;
# a transport pulled in here would land in both CLIs without either asking for it.
dependencies = []

[project.optional-dependencies]
# Section 9 of the architecture assessment: transports are optional, and the two
# domain extras are declared now so the later `ha/` and `plex/` steps have somewhere
# to land without a packaging change. `ha` is empty because its transport is stdlib.
ha = []
plex = ["PlexAPI>=4.18"]
cli = []
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]
# The requirements layer's toolchain: the loader that validates `metaobjects/` and
# the generator that reads it. Build-time only -- nothing under `src/axi_toolkit`
# imports it, and the generated checks it emits are committed and run under plain
# pytest. Its own floor is 3.11, which is why it is not in `dev`: the test matrix
# runs down to 3.9 and must not need it. A range, not a pin: a downstream tool picks its
# own MetaObjects within it. This repository's own checks run against the exact version
# in dev-constraints.txt.
reqgen = [
  "metaobjects>=1.1.0,<2",
]

# The shared MetaObjects generators in `axi_toolkit.metagen`: what a tool's own
# `metaobjects.config.yaml` names as `axi_toolkit.metagen:<generator>`. Development time
# only -- nothing in the library imports that subpackage (tests/test_purity.py holds it
# there), so installing the wheel without this extra gives exactly the library. The
# toolchain requires Python 3.11 or newer, and the requirement makes an install on an older
# interpreter fail where it is asked for rather than quietly install nothing. The package
# floor above does not move. The range leaves the version to the consumer; 1.1.4, the
# version this package is checked against, is held in dev-constraints.txt.
metagen = [
  "metaobjects>=1.1.0,<2",
]

[project.urls]
Homepage = "https://github.com/dmealing/axi-toolkit"
Source = "https://github.com/dmealing/axi-toolkit"
Issues = "https://github.com/dmealing/axi-toolkit/issues"
Changelog = "https://github.com/dmealing/axi-toolkit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dmealing/axi-toolkit#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/axi_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "scripts"]

# A synthetic consumer's committed generator output: owned by `axi_toolkit.metagen`, and a
# formatter or fixer reflowing it would fail the byte-for-byte comparison its test makes.
extend-exclude = ["tests/metagen/project/generated", "tests/metagen/json_project/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
# The generated conformance module is linted like everything else, but its layout is
# owned by `scripts/reqgen.py`: a formatter reflowing it would make `reqgen check`
# report a difference the declaration did not cause, on every run, forever.
exclude = ["tests/conformance/test_requirements_generated.py"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:axi_toolkit.*"]
